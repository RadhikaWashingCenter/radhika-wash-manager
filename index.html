<script>
(()=>{'use strict';
const KEY='radhika_manager_offline_v1';
const OLD_KEY='radhika_manager_preview_v3';
const PRICES={small:249,medium:299,large:399,custom:null};
const CATS={small:'Small Car',medium:'Medium Car',large:'Large Car',custom:'Custom Car'};
const SERVICES=['Complete Car Wash','Exterior Foam Wash','Interior Vacuum & Dashboard','Other Service'];
const NAV=[['dashboard','▦','Dashboard'],['wash','＋','New Wash'],['records','▤','Wash Records'],['employees','♙','Employees'],['attendance','▣','Attendance'],['payroll','₹','Salary & Incentives'],['business','⌖','Business Info'],['settings','☁','Drive & Settings']];
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const timeLocal=(d=new Date())=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const employeeSample=()=>Array.from({length:3},(_,i)=>({id:'emp'+(i+1),name:'Employee '+(i+1),phone:'',salary:6000,attendanceBonus:1000,performanceBonus:1000,joined:dateLocal(),active:true}));
function sample(){const employees=employeeSample();const today=dateLocal();const yesterday=dateLocal(new Date(Date.now()-86400000));const categories=['small','medium','large','small','medium','small','large','medium','small','small','medium','large','small'];const records=categories.map((c,i)=>({id:'demo'+i,created:Date.now()+i,date:today,time:String(9+Math.floor(i/4)).padStart(2,'0')+':'+String(i%4*15).padStart(2,'0'),carNo:'UP15DE'+String(1031+i),category:c,service:'Complete Car Wash',price:PRICES[c],method:i%3===0?'Online':'Cash',status:i===12?'Pending':'Paid',staff:employees.map(e=>e.id),customerName:'',phone:'',notes:'',demo:true}));records.push({id:'demoy',created:Date.now()-86400000,date:yesterday,time:'14:15',carNo:'UP15DF2048',category:'medium',service:'Complete Car Wash',price:299,method:'Online',status:'Paid',staff:employees.map(e=>e.id),customerName:'',phone:'',notes:'',demo:true});return{employees,records,attendance:{},payroll:{},settings:{workingDays:26},demo:true};}
function blank(){return {employees:[],records:[],attendance:{},payroll:{},settings:{workingDays:26},demo:false};}
function isValidState(o){return !!o && Array.isArray(o.employees) && Array.isArray(o.records) && o.attendance && typeof o.attendance==='object' && o.payroll && typeof o.payroll==='object' && o.settings && typeof o.settings==='object' && o.employees.length<1000 && o.records.length<500000;}
function ensureReceiptNumbers(data){
  // Backfill older records once. Already issued numbers are immutable, including after editing.
  data.settings=data.settings||{};
  const seen=new Set();
  const ordered=[...data.records].sort((a,b)=>
    (Number(a.created)||0)-(Number(b.created)||0)||
    String(a.date||'').localeCompare(String(b.date||''))||
    String(a.time||'').localeCompare(String(b.time||''))||
    String(a.id||'').localeCompare(String(b.id||'')));
  for(const r of ordered){const n=Number(r.receiptNo);if(Number.isSafeInteger(n)&&n>0&&!seen.has(n)){seen.add(n);}else{r.receiptNo=null;}}
  let next=Math.max(1,Number(data.settings.nextReceiptNo)||1);
  for(const r of ordered){if(!r.receiptNo){while(seen.has(next))next++;r.receiptNo=next;seen.add(next);next++;}}
  let highest=0;for(const n of seen)if(n>highest)highest=n;data.settings.nextReceiptNo=Math.max(next,Number(data.settings.nextReceiptNo)||1,highest+1);
  return data;
}
function load(){try{if(window.AndroidStorage){const obj=JSON.parse(AndroidStorage.load()||'null');if(isValidState(obj))return ensureReceiptNumbers(obj);}}catch(e){}try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(isValidState(data))return ensureReceiptNumbers(data);}}catch(e){}return ensureReceiptNumbers(blank());}
let idb=null, storageReady=false, bootDone=false, writeQueue=Promise.resolve();
function openDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const request=indexedDB.open('RadhikaWashingCenterDB',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('data'))request.result.createObjectStore('data');};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('Could not open phone database'));});}
function getDbState(){return new Promise((resolve,reject)=>{const tx=idb.transaction('data','readonly');const req=tx.objectStore('data').get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function putDbState(payload){return new Promise((resolve,reject)=>{if(!idb)return reject(new Error('Database not available'));const tx=idb.transaction('data','readwrite');tx.objectStore('data').put(payload,'main');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Write failed'));tx.onabort=()=>reject(tx.error||new Error('Transaction aborted'));});}
async function boot(){if(window.AndroidStorage){ensureReceiptNumbers(db);persist();storageReady=true;bootDone=true;document.body.dataset.storage='native-sqlite';render();return;}try{idb=await openDatabase();const stored=await getDbState();if(isValidState(stored)){db=ensureReceiptNumbers(stored);await putDbState(structuredClone(db));} else {let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}if(isValidState(saved)){db=ensureReceiptNumbers(saved);}await putDbState(structuredClone(db));}storageReady=true;document.body.dataset.storage='database';}catch(e){storageReady=false;document.body.dataset.storage='fallback';try{localStorage.setItem(KEY,JSON.stringify(db));}catch(err){}toast('Device database unavailable. Please export backups after each session.');}bootDone=true;render();updateCloudBadge();}

let db=load(),view='dashboard',draft=null,editingEmployee=null,formError='',filter={search:'',date:'',method:'all'},attDate=dateLocal(),payMonth=dateLocal().slice(0,7),dialog='',lastReceipt=null;

// Google Drive integration: one-phone, offline-first. Google OAuth tokens are kept only in memory.
// A visible JSON file is created in the user's My Drive with the narrow drive.file OAuth scope.
const CLOUD_CONFIG_KEY='radhika_drive_config_v2';
const CLOUD_DATA_NAME='Radhika_Washing_Center_Live_Data.json';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_API='https://www.googleapis.com/drive/v3/files';
const DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3/files';
const getCloudConfig=()=>{try{return {...{clientId:'',fileId:'',lastRemoteVersion:'',lastRemoteFingerprint:'',lastSyncedFingerprint:'',lastSyncAt:'',backupDay:''},...JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')};}catch(e){return {clientId:'',fileId:'',lastRemoteVersion:'',lastRemoteFingerprint:'',lastSyncedFingerprint:'',lastSyncAt:'',backupDay:''};}};
let cloudCfg=getCloudConfig();
let cloud={token:'',expiresAt:0,busy:false,status:'Google Drive not connected',error:'',conflict:null,timer:null,changedDuringSync:false};
let suppressCloudSync=false;
function cloudConfigSave(){try{localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudCfg));}catch(e){console.warn('Unable to save Drive configuration',e);}}
function cloudFingerprint(o){const str=JSON.stringify(o);let a=2166136261,b=0;for(let i=0;i<str.length;i++){a=Math.imul(a^str.charCodeAt(i),16777619);b=Math.imul(b^str.charCodeAt(i),2246822519);}return str.length+'-'+(a>>>0).toString(16)+'-'+(b>>>0).toString(16);}
function cloudStatusText(){if(cloud.busy)return 'Syncing to Google Drive…';if(cloud.conflict)return 'Action needed: choose phone or Drive data';if(cloud.token&&Date.now()<cloud.expiresAt-20000){return cloudFingerprint(db)!==cloudCfg.lastSyncedFingerprint?'Phone changes waiting to sync':'Google Drive connected · '+(cloudCfg.lastSyncAt?'Last sync '+new Date(cloudCfg.lastSyncAt).toLocaleString('en-IN'):'Ready');}if(cloudCfg.clientId)return 'Google sign-in required · Local data safe';return 'Not configured · Local data only';}
function updateCloudBadge(){const badge=$('#cloudPill');if(badge){badge.textContent=cloud.busy?'↻ GOOGLE DRIVE SYNCING':cloud.conflict?'! SYNC ACTION NEEDED':cloud.token&&Date.now()<cloud.expiresAt-20000?'● DRIVE '+(cloudFingerprint(db)!==cloudCfg.lastSyncedFingerprint?'PENDING':'SYNCED'):'● PHONE / DRIVE OFF';badge.title=cloudStatusText();}const el=$('#driveStatus');if(el)el.textContent=cloudStatusText();const date=$('#driveLastSync');if(date)date.textContent=cloudCfg.lastSyncAt?new Date(cloudCfg.lastSyncAt).toLocaleString('en-IN'):'Never';const info=$('#cloudError');if(info){info.textContent=cloud.error||'';info.hidden=!cloud.error;}}
function cloudSettingsPanel(){const secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';const ready=!!cloudCfg.clientId;return `<section class="panel" style="border-color:#ead37a"><div class="panel-head"><div><h2>☁ Google Drive Automatic Backup</h2><p class="panel-sub" style="margin:5px 0 0">Free • Works on one phone • Your data remains available offline</p></div><span class="tag ${cloud.token?'tag-paid':'tag-pending'}">${cloud.token?'Connected':'Setup needed'}</span></div><div class="top-kpi" style="display:block"><strong id="driveStatus">${esc(cloudStatusText())}</strong><div class="panel-sub" style="margin-top:5px">Last successful sync: <span id="driveLastSync">${cloudCfg.lastSyncAt?esc(new Date(cloudCfg.lastSyncAt).toLocaleString('en-IN')):'Never'}</span></div></div><p class="faq">Data is saved immediately to this phone. When the app is open, online and Google is signed in, changes sync to <b>My Drive / ${CLOUD_DATA_NAME}</b> automatically. No payment or backend server is needed for normal use.</p>${!secure?'<div class="tip" style="margin-bottom:14px"><b>Google Login cannot run from a downloaded file.</b> Publish this exact app to a free HTTPS site first. Your phone-only app still works offline.</div>':''}<div class="field" style="max-width:700px"><label for="cloudClientId">Google Cloud OAuth Client ID (Web Application)</label><input id="cloudClientId" autocomplete="off" spellcheck="false" placeholder="1234567890-xxxxx.apps.googleusercontent.com" value="${esc(cloudCfg.clientId)}"><div class="field-help">Paste only your public OAuth Client ID. Never paste a client secret or Google password.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:13px 0"><button class="btn" data-action="cloud-save-client">Save Client ID</button><button class="btn btn-primary" data-action="cloud-connect" ${!secure||!ready?'disabled':''}>${cloud.token?'↻ Reconnect Google':'☁ Connect Google Drive'}</button><button class="btn" data-action="cloud-sync" ${!cloud.token?'disabled':''}>↻ Sync Now</button><button class="btn" data-action="cloud-disconnect" ${!cloud.token?'disabled':''}>Disconnect</button></div><p class="message" id="cloudError" ${cloud.error?'':'hidden'}>${esc(cloud.error)}</p><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:800">First-time Google Drive setup (free)</summary><div class="faq" style="margin-top:10px"><p>1. Publish this app on a <b>free HTTPS host</b> (for example, GitHub Pages). Open that HTTPS link in Chrome.</p><p>2. In <b>Google Cloud Console</b>, create a project and enable <b>Google Drive API</b>.</p><p>3. Configure <b>Google Auth Platform / OAuth consent screen</b> as External, add your own Gmail to Test users when in Testing.</p><p>4. Create an OAuth Client for a <b>Web application</b>. Add the app's origin (for example, https://YOURNAME.github.io) to Authorized JavaScript origins. Do not add any path.</p><p>5. Paste the client ID above, Save, then Connect Google Drive and approve access.</p><p>6. First connection: if both the phone and Drive contain records, the app will ask which copy to use. It will never silently overwrite either on first connection.</p><p>Cloud backup requires an active login session; you may need to tap Reconnect after access expires. Google does not support reliable permanent unattended sign-in from a standalone HTML page.</p></div></details><div class="tip" style="margin-top:12px"><b>Safety:</b> Automatic backups run when the app is open. They do not run after Chrome has been fully closed. This is not guaranteed background syncing. A dated recovery snapshot is kept in My Drive before the first overwrite each day; use Full JSON Backup for extra safety.</div></section>`;}
function saveCloudClient(){const el=$('#cloudClientId');const id=String(el?.value||'').trim();if(!/^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/.test(id)){toast('Enter a valid Web OAuth Client ID.');return;}if(cloudCfg.clientId&&cloudCfg.clientId!==id){if(!confirm('Change Google OAuth project? Your current Drive backup may no longer be accessible. Export a JSON backup first.'))return;cloudCfg.fileId='';cloudCfg.lastRemoteVersion='';cloudCfg.lastRemoteFingerprint='';cloudCfg.lastSyncedFingerprint='';cloudCfg.lastSyncAt='';cloud.token='';cloud.expiresAt=0;}cloudCfg.clientId=id;cloudConfigSave();render();toast('Client ID saved. Now connect your Google Account.');}
function disconnectCloud(){cloud.token='';cloud.expiresAt=0;cloud.error='';cloud.conflict=null;if(cloud.timer)clearTimeout(cloud.timer);cloud.timer=null;try{if(window.google?.accounts?.oauth2)google.accounts.oauth2.revoke?.(cloud.lastToken||'',()=>{});}catch(e){}render();toast('Google disconnected. Phone data is untouched.');}
async function connectGoogleDrive(){if(!/^https?:$/.test(location.protocol)||!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return toast('Open this app on HTTPS to use Google Login.');if(!cloudCfg.clientId)return toast('Save your Google OAuth Client ID first.');if(!navigator.onLine)return toast('Internet required for Google Login.');if(!window.google?.accounts?.oauth2?.initTokenClient){cloud.error='Google sign-in library not loaded. Check internet and try again.';updateCloudBadge();return;}cloud.error='';try{const client=google.accounts.oauth2.initTokenClient({client_id:cloudCfg.clientId,scope:DRIVE_SCOPE,callback:async response=>{if(response.error){cloud.error='Google permission error: '+response.error;updateCloudBadge();return;}cloud.token=response.access_token;cloud.lastToken=response.access_token;cloud.expiresAt=Date.now()+(Number(response.expires_in)||3500)*1000;cloud.error='';render();await syncCloud(false);},error_callback:err=>{cloud.error='Google login was closed or blocked. Open in Chrome and retry.';console.error(err);updateCloudBadge();}});client.requestAccessToken({prompt:'consent'});}catch(e){cloud.error=String(e.message||e);updateCloudBadge();}}
function scheduleCloudSync(){if(!cloud.token||cloud.conflict)return;if(cloud.busy){cloud.changedDuringSync=true;return;}if(cloud.timer)clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>syncCloud(false),2200);updateCloudBadge();}
async function driveFetch(url,options={}){if(!cloud.token||Date.now()>cloud.expiresAt-10000){cloud.token='';throw new Error('Google session expired. Tap Connect Google Drive again.');}if(!navigator.onLine)throw new Error('Internet offline. Saved on phone, sync will retry when open and online.');const res=await fetch(url,{...options,headers:{Authorization:'Bearer '+cloud.token,...options.headers}});if(!res.ok){let message='';try{const j=await res.json();message=j.error?.message||JSON.stringify(j);}catch(e){message=await res.text();}if(res.status===401){cloud.token='';message='Google session expired. Reconnect Google Drive.';}throw new Error('Drive API '+res.status+': '+message.slice(0,220));}return res;}
async function driveFind(){const p=new URLSearchParams({q:"name = '"+CLOUD_DATA_NAME+"' and trashed = false",fields:'nextPageToken,files(id,name,modifiedTime,version,size)',pageSize:'100'});const res=await driveFetch(DRIVE_API+'?'+p.toString());const body=await res.json();return (body.files||[]).sort((a,b)=>(new Date(b.modifiedTime)-new Date(a.modifiedTime)))[0]||null;}
async function driveRead(id){const res=await driveFetch(DRIVE_API+'/'+encodeURIComponent(id)+'?alt=media');const text=await res.text();if(text.length>25*1024*1024)throw new Error('Cloud data too large for mobile');const obj=JSON.parse(text);const state=obj?.data||obj;if(!isValidState(state))throw new Error('Drive backup has an invalid format. It was not overwritten.');return {data:state,meta:obj,fingerprint:cloudFingerprint(state),raw:text};}
async function driveCreate(name,content){const boundary='radhika_'+uid();const blob=new Blob(['--'+boundary+'\r\n','Content-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify({name,mimeType:'application/json'}),'\r\n--'+boundary+'\r\n','Content-Type: application/json; charset=UTF-8\r\n\r\n',content,'\r\n--'+boundary+'--\r\n'],{type:'multipart/related; boundary='+boundary});const res=await driveFetch(DRIVE_UPLOAD+'?uploadType=multipart&fields=id,name,modifiedTime,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:blob});return await res.json();}
async function driveUpdate(id,content){const res=await driveFetch(DRIVE_UPLOAD+'/'+encodeURIComponent(id)+'?uploadType=media&fields=id,name,modifiedTime,version',{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:content});return await res.json();}
function isEmptyPhoneState(state){return !state.records.length&&!state.employees.length&&!Object.keys(state.attendance).length&&!Object.keys(state.payroll).length;}
async function receiveCloudData(remote,file){suppressCloudSync=true;try{db=ensureReceiptNumbers(JSON.parse(JSON.stringify(remote.data)));persist();await writeQueue;}finally{suppressCloudSync=false;}draft=null;cloudCfg.fileId=file.id;cloudCfg.lastRemoteVersion=String(file.version||'');cloudCfg.lastRemoteFingerprint=remote.fingerprint;cloudCfg.lastSyncedFingerprint=remote.fingerprint;cloudCfg.lastSyncAt=new Date().toISOString();cloudConfigSave();render();toast('Google Drive data loaded successfully.');if(cloudCfg.lastSyncedFingerprint!==remote.fingerprint)scheduleCloudSync();}
async function uploadCloud(file,previous){await writeQueue;const snapshot=JSON.parse(JSON.stringify(db));const signature=cloudFingerprint(snapshot);const doc=JSON.stringify({format:'RadhikaWashingCenter',schemaVersion:2,savedAt:new Date().toISOString(),source:'one-phone-pwa',data:snapshot});if(doc.length>4*1024*1024)throw new Error('Backup is getting too large for a single upload. Export JSON and contact developer.');if(file&&previous){const today=dateLocal();if(cloudCfg.backupDay!==today||previous.data.records.length>snapshot.records.length+5){const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/T/,'_').slice(0,15);await driveCreate('Radhika_Recovery_'+stamp+'_'+uid()+'.json',previous.raw);cloudCfg.backupDay=today;cloudConfigSave();}}
const uploaded=file?await driveUpdate(file.id,doc):await driveCreate(CLOUD_DATA_NAME,doc);cloudCfg.fileId=uploaded.id;cloudCfg.lastRemoteVersion=String(uploaded.version||'');cloudCfg.lastRemoteFingerprint=signature;cloudCfg.lastSyncedFingerprint=signature;cloudCfg.lastSyncAt=new Date().toISOString();cloudConfigSave();cloud.status='Synced';toast('Google Drive backup updated.');}
async function syncCloud(manual=false){if(cloud.busy){cloud.changedDuringSync=true;return;}if(!cloud.token){if(manual)toast('Connect Google Drive first.');return;}if(cloud.conflict){if(manual)showCloudConflict();return;}if(!navigator.onLine){if(manual)toast('Offline: saved to phone. Drive sync will resume online.');return;}cloud.busy=true;cloud.error='';cloud.changedDuringSync=false;updateCloudBadge();try{const file=await driveFind();if(!file){if(cloudCfg.fileId){throw new Error('Your previous Drive backup is missing or was deleted. Export a local JSON backup, then reconnect after checking Drive.');}await uploadCloud(null,null);return;}const remote=await driveRead(file.id);const localSignature=cloudFingerprint(db);const localClean=!!cloudCfg.lastSyncedFingerprint&&localSignature===cloudCfg.lastSyncedFingerprint;
const remoteKnown=!!cloudCfg.lastRemoteFingerprint&&remote.fingerprint===cloudCfg.lastRemoteFingerprint;
if(localSignature===remote.fingerprint){cloudCfg.fileId=file.id;cloudCfg.lastRemoteVersion=String(file.version||'');cloudCfg.lastRemoteFingerprint=remote.fingerprint;cloudCfg.lastSyncedFingerprint=localSignature;cloudCfg.lastSyncAt=new Date().toISOString();cloudConfigSave();return;}
if(isEmptyPhoneState(db)&&!cloudCfg.lastSyncedFingerprint){await receiveCloudData(remote,file);return;}
if(localClean){await receiveCloudData(remote,file);return;}
if(remoteKnown){await uploadCloud(file,remote);return;}
cloud.conflict={file,remote};cloud.error='Phone and Drive have different data. Choose the correct copy; nothing has been overwritten.';showCloudConflict();
}catch(err){cloud.error=String(err.message||err);console.error('Drive sync failed:',err);if(manual)toast('Drive sync problem. See Settings.');}finally{cloud.busy=false;updateCloudBadge();if(cloud.changedDuringSync&&!cloud.conflict&&cloud.token){cloud.changedDuringSync=false;scheduleCloudSync();}}}
function showCloudConflict(){const c=cloud.conflict;if(!c)return;$('#modalRoot').innerHTML=`<div class="dialog-backdrop"><div class="dialog"><div class="dialog-top"><div><h2 style="margin:0">Choose your correct data</h2><p class="panel-sub">Phone and Google Drive are different</p></div></div><p>Phone: <b>${db.records.length} wash records</b>, ${db.employees.length} employees</p><p>Google Drive: <b>${c.remote.data.records.length} wash records</b>, ${c.remote.data.employees.length} employees</p><div class="tip"><b>Important:</b> This is a one-phone app. It will not automatically merge two conflicting copies. Before changing either copy, download a Full JSON Backup in Settings. Your existing Drive data is preserved in a dated recovery snapshot before overwrite.</div><div class="receipt-controls" style="margin-top:16px"><button class="btn btn-primary" data-action="cloud-conflict-phone">Keep PHONE data → Upload</button><button class="btn" data-action="cloud-conflict-drive">Use GOOGLE DRIVE data → Restore</button><button class="btn" data-action="close-modal">Cancel for now</button></div></div></div>`;}
async function resolveCloudConflict(source){const c=cloud.conflict;if(!c||cloud.busy)return;const wantsPhone=source==='phone';if(!confirm(wantsPhone?'Keep PHONE records and replace the main Google Drive copy?':'Use GOOGLE DRIVE records to replace the current phone data? First export a local JSON backup if needed.'))return;cloud.busy=true;cloud.error='';updateCloudBadge();try{if(wantsPhone){await uploadCloud(c.file,c.remote);}else{await receiveCloudData(c.remote,c.file);}cloud.conflict=null;$('#modalRoot').innerHTML='';render();}catch(err){cloud.error=String(err.message||err);toast('Could not complete data choice.');}finally{cloud.busy=false;updateCloudBadge();}}
window.addEventListener('online',()=>{if(cloud.token)scheduleCloudSync();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.token)scheduleCloudSync();});
setInterval(()=>{if(cloud.token&&!cloud.busy&&navigator.onLine&&!document.hidden)syncCloud(false);else if(cloud.token&&Date.now()>cloud.expiresAt-10000)updateCloudBadge();},60000);

function persist(){const snapshot=JSON.parse(JSON.stringify(db));if(window.AndroidStorage){try{if(!AndroidStorage.save(JSON.stringify(snapshot)))toast('Save failed: export a backup.');}catch(e){toast('Save failed: export a backup.');}if(bootDone&&!suppressCloudSync)scheduleCloudSync();return;}try{localStorage.setItem(KEY,JSON.stringify(snapshot));}catch(e){}if(storageReady){writeQueue=writeQueue.catch(()=>{}).then(()=>putDbState(snapshot)).catch(e=>{storageReady=false;document.body.dataset.storage='fallback';toast('Database save failed. Export a backup now.');console.error(e);});}else if(bootDone){toast('Phone database unavailable. Back up your records.');}if(bootDone&&!suppressCloudSync)scheduleCloudSync();}

function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toastRoot').innerHTML='',3900);}
function newDraft(){return{customerName:'',carNo:'',category:'small',service:'Complete Car Wash',price:'249',method:'Cash',status:'Paid',staff:db.employees.filter(e=>e.active).map(e=>e.id),phone:'',notes:'',date:dateLocal(),time:timeLocal(),id:null};}
function nav(v){$('#modalRoot').innerHTML='';view=v;formError='';if(v==='wash'&&!draft)draft=newDraft();render();window.scrollTo({top:0,behavior:'instant'});}
function navButtons(){return NAV.map(([id,icon,label])=>`<button class="nav-button ${view===id?'active':''}" data-nav="${id}"><span class="nav-icon">${icon}</span>${esc(label)}</button>`).join('');}
function mobileButtons(){return [['dashboard','▦','Home'],['wash','＋','New Wash'],['records','▤','Records'],['employees','♙','Staff'],['payroll','₹','Salary']].map(([id,icon,label])=>`<button class="mobile-tab ${view===id?'active':''}" data-nav="${id}"><span>${icon}</span><span>${label}</span></button>`).join('');}
const heading=(title,description,actions='')=>`<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
const empty=(title,desc)=>`<div class="empty"><div class="empty-icon">▤</div><strong>${title}</strong>${desc}</div>`;
function stats(date){let rs=db.records.filter(r=>r.date===date),paid=rs.filter(r=>r.status==='Paid');return{count:rs.length,cash:paid.filter(r=>r.method==='Cash').reduce((s,r)=>s+r.price,0),online:paid.filter(r=>r.method==='Online').reduce((s,r)=>s+r.price,0),pending:rs.filter(r=>r.status==='Pending').reduce((s,r)=>s+r.price,0)};}
function dailyIncentives(date){const ordered=db.records.filter(r=>r.date===date).slice().sort((a,b)=>a.time.localeCompare(b.time)||a.created-b.created||a.id.localeCompare(b.id));let totals={};const details=ordered.map((r,i)=>{const rate=i<10?0:5*(Math.floor((i-10)/5)+1);(r.staff||[]).forEach(id=>totals[id]=(totals[id]||0)+rate);return{...r,sequence:i+1,rate};});return{totals,details};}
function monthlyIncentives(month){const dates=[...new Set(db.records.filter(r=>r.date.startsWith(month)).map(r=>r.date))];let result={};for(const date of dates){const t=dailyIncentives(date).totals;Object.entries(t).forEach(([id,n])=>result[id]=(result[id]||0)+n);}return result;}
function recordRows(records,opts={}){return records.map(r=>`<tr><td><strong>#${esc(r.receiptNo||'—')}</strong></td><td><div class="vehicle-no">${esc(r.carNo)}</div><span class="muted" style="font-size:11px">${esc(r.date)} · ${esc(r.time)}</span></td><td>${esc(r.customerName||'—')}</td><td>${esc(CATS[r.category]||r.category)}${r.demo?' <span class="tag tag-demo">Sample</span>':''}</td><td>${money(r.price)}</td><td>${esc(r.method)}</td><td><span class="tag ${r.status==='Paid'?'tag-paid':'tag-pending'}">${esc(r.status)}</span></td>${opts.noActions?'':`<td><div class="actions"><button class="link-btn" data-action="receipt" data-id="${r.id}">Receipt</button><button class="link-btn" data-action="edit-record" data-id="${r.id}">Edit</button><button class="link-btn danger" data-action="delete-record" data-id="${r.id}">Delete</button></div></td>`}</tr>`).join('');}
function table(rs,opts={}){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Receipt No.</th><th>Vehicle / Date</th><th>Customer</th><th>Category</th><th>Amount</th><th>Payment</th><th>Status</th>${opts.noActions?'':'<th>Actions</th>'}</tr></thead><tbody>${recordRows(rs,opts)}</tbody></table></div>`;}
function dashboard(){const s=stats(dateLocal()),paid=s.cash+s.online,inst=dailyIncentives(dateLocal());const week=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let key=dateLocal(d);let r=stats(key);return{day:d.toLocaleDateString('en-IN',{weekday:'short'}),value:r.cash+r.online};});const max=Math.max(...week.map(w=>w.value),1);return heading('Business Overview','Your car wash operations at a glance.',`<button class="btn btn-primary" data-nav="wash">＋ Record a Wash</button>`)+`<div class="banner"><div><h2>Run your washing center, simply.</h2><p>Vehicle entries, payments and staff incentives in one place.</p></div><button class="btn btn-primary" data-nav="wash">＋ New Wash</button></div><div class="stats"><div class="stat-card"><div class="stat-head">Today's Washes <span class="stat-icon">🚘</span></div><div class="stat-value">${s.count}</div><div class="stat-foot">All recorded vehicles today</div></div><div class="stat-card"><div class="stat-head">Paid Collection <span class="stat-icon">₹</span></div><div class="stat-value">${money(paid)}</div><div class="stat-foot">Cash + online received</div></div><div class="stat-card"><div class="stat-head">Cash / Online <span class="stat-icon">▥</span></div><div class="stat-value" style="font-size:20px">${money(s.cash)} <span class="muted">/</span> ${money(s.online)}</div><div class="stat-foot">Payment method split</div></div><div class="stat-card"><div class="stat-head">Pending Payment <span class="stat-icon">◷</span></div><div class="stat-value">${money(s.pending)}</div><div class="stat-foot">Not counted as collected</div></div></div><div class="content-grid"><div><section class="panel"><div class="panel-head"><div><h2>Recent wash entries</h2><span class="panel-sub">Latest saved vehicle records</span></div><button class="textlink" data-nav="records">View all →</button></div>${db.records.length?table([...db.records].sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time)).slice(0,6),{noActions:true}):empty('No washes yet','Add the first record to start tracking.')}</section><section class="panel"><div class="panel-head"><h2>Collections · Last 7 days</h2><span class="panel-sub">Paid amounts only</span></div><div class="bar-chart">${week.map(w=>`<div class="bar-item"><span class="bar-value">${w.value?money(w.value):''}</span><div class="bar-track"><div class="bar-fill" style="height:${Math.max(2,w.value/max*100)}%"></div></div><span class="bar-label">${w.day}</span></div>`).join('')}</div></section></div><div><section class="panel"><div class="panel-head"><h2>Quick actions</h2></div><div class="shortcuts"><button class="shortcut" data-nav="wash">🚘 New wash</button><button class="shortcut" data-nav="attendance">▣ Attendance</button><button class="shortcut" data-nav="payroll">₹ Salary & incentives</button><button class="shortcut" data-nav="business">⌖ Business info</button></div></section><section class="panel"><div class="panel-head"><h2>Staff incentives today</h2><button class="textlink" data-nav="payroll">Full report →</button></div>${db.employees.filter(e=>e.active).map(e=>`<div class="price-row"><div class="service-name">${esc(e.name)}</div><strong>${money(inst.totals[e.id]||0)}</strong></div>`).join('')||empty('No employees','Add workers to track incentives.')}<p class="faq">Rates apply per wash after the first 10 daily washes. Each assigned employee earns the corresponding slab amount.</p></section><section class="tip">🔒 <b>Phone-only data.</b> New records are stored locally. No cloud sync. Use Settings → Backup JSON regularly; clearing browser/app data or uninstalling can erase records.</section></div></div>`;}
function wash(){const d=draft||newDraft();const c=PRICES[d.category],custom=d.category==='custom';return heading(d.id?'Edit Wash Record':'New Car Wash Entry','Save vehicle details, assign workers and record payment.')+`<div class="content-grid" style="grid-template-columns:minmax(0,1.6fr) minmax(275px,.85fr)"><div><div class="panel"><div class="panel-head"><h2>1. Vehicle & Service</h2><span class="tag tag-demo">Fast entry</span></div><div class="form-grid"><div class="field span-2"><label for="carNo">Car Registration Number *</label><input id="carNo" data-draft="carNo" value="${esc(d.carNo)}" placeholder="UP15 AB 1234" autocomplete="off" maxlength="16"><span class="field-help">Indian number format, e.g. UP15 AB 1234 or 22 BH 1234 AA.</span></div><div class="span-2"><div class="field-label" style="margin-bottom:9px">Vehicle Category *</div><div class="choice-grid">${Object.keys(CATS).map(k=>`<button class="choice ${d.category===k?'selected':''}" data-action="category" data-val="${k}"><span class="choice-name">${esc(CATS[k])}</span><span class="choice-price">${PRICES[k]==null?'Ask Price':money(PRICES[k])}</span></button>`).join('')}</div></div><div class="field span-2"><label for="service">Service</label><select id="service" data-draft="service">${SERVICES.map(s=>`<option ${d.service===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="washPrice">Price (₹) *</label><input id="washPrice" data-draft="price" value="${esc(d.price)}" inputmode="decimal" type="number" min="1" step="1" placeholder="${custom?'Enter custom amount':'Price'}"><span class="field-help">${custom?'Custom Car: enter price manually.':'Auto-filled; editable if required.'}</span></div><div class="field"><label for="washDate">Wash Date *</label><input id="washDate" type="date" data-draft="date" value="${esc(d.date)}"></div><div class="field"><label for="washTime">Wash Time *</label><input id="washTime" type="time" data-draft="time" value="${esc(d.time)}"></div><div class="field"><label for="customerName">Customer name (optional)</label><input id="customerName" data-draft="customerName" value="${esc(d.customerName||'')}" maxlength="80" autocomplete="name" placeholder="Enter customer name"></div><div class="field"><label for="phone">Customer mobile (optional)</label><input id="phone" data-draft="phone" value="${esc(d.phone)}" inputmode="tel" placeholder="10 digit number"></div></div></div><div class="panel"><div class="panel-head"><h2>2. Payment Details</h2></div><div class="form-grid"><div class="field span-2"><span class="field-label">Payment Method</span><div class="segmented"><button data-action="method" data-val="Cash" class="segment ${d.method==='Cash'?'active':''}">₹ Cash</button><button data-action="method" data-val="Online" class="segment ${d.method==='Online'?'active':''}">▥ Online / UPI</button></div></div><div class="field span-2"><span class="field-label">Payment Status</span><div class="segmented"><button data-action="status" data-val="Paid" class="segment ${d.status==='Paid'?'active':''}">✓ Paid</button><button data-action="status" data-val="Pending" class="segment ${d.status==='Pending'?'active':''}">◷ Pending</button></div></div></div></div><div class="panel"><div class="panel-head"><h2>3. Employee Assignment</h2><span class="panel-sub">Select everyone who worked on this car</span></div><div class="staff-checks">${db.employees.filter(e=>e.active||(d.staff||[]).includes(e.id)).map(e=>`<button class="staff-chip ${(d.staff||[]).includes(e.id)?'active':''}" data-action="staff" data-id="${e.id}"><span class="tick">${(d.staff||[]).includes(e.id)?'✓':''}</span>${esc(e.name)}</button>`).join('')}</div><p class="faq">Incentive is assigned to the selected workers using the day's wash-count slabs.</p><div class="field"><label for="washNotes">Notes (optional)</label><textarea id="washNotes" data-draft="notes" placeholder="Special service, customer request...">${esc(d.notes)}</textarea></div>${formError?`<p class="message" role="alert">${esc(formError)}</p>`:''}<div class="form-actions"><button class="btn" data-action="clear-draft">Clear</button><button class="btn btn-primary" data-action="save-wash">✓ ${d.id?'Update':'Save'} Wash Record</button></div></div></div><div><div class="panel"><h2>Entry Summary</h2><div class="price-row"><span>Vehicle</span><strong style="font-size:14px">${esc(CATS[d.category])}</strong></div><div class="price-row"><span>Customer</span><span style="font-size:12px;font-weight:650">${esc(d.customerName||'Optional')}</span></div><div class="price-row"><span>Service</span><span style="font-size:12px;font-weight:650">${esc(d.service)}</span></div><div class="price-row"><span>Payment</span><span style="font-size:12px;font-weight:700">${esc(d.method)} · ${esc(d.status)}</span></div><div class="price-row"><span>Assigned workers</span><span style="font-weight:800">${d.staff.length}</span></div><div class="top-kpi" style="margin-top:13px"><div><div class="panel-sub">Total price</div><div class="amount">${Number(d.price)>0?money(d.price):'Ask Price'}</div></div></div></div><div class="tip"><b>Pricing set as requested</b><br>Small ₹249 · Medium ₹299 · Large ₹399 · Custom: manual price.<br><br>Cash and online collections are counted only when marked Paid.</div></div></div>`;}
function records(){let rs=[...db.records];if(filter.search.trim()){let q=filter.search.trim().toUpperCase(),normalized=q.replace(/\s/g,'');rs=rs.filter(r=>r.carNo.replace(/\s/g,'').includes(normalized)||String(r.customerName||'').toUpperCase().includes(q));}if(filter.date)rs=rs.filter(r=>r.date===filter.date);if(filter.method!=='all')rs=rs.filter(r=>r.method===filter.method||r.status===filter.method);rs.sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time)||b.created-a.created);const sum=rs.filter(r=>r.status==='Paid').reduce((s,r)=>s+r.price,0);return heading('Wash Records','Search, edit, print receipts and export your entries.',`<button class="btn" data-action="show-incentives">₹ Daily Incentives ↓</button><button class="btn" data-action="export-csv">↓ Export CSV</button><button class="btn btn-primary" data-nav="wash">＋ New Wash</button>`)+`<section class="panel"><div class="filters"><input class="search-input" data-filter="search" value="${esc(filter.search)}" placeholder="Search car number or customer name..." aria-label="Search car number or customer name"><input class="search-input" type="date" data-filter="date" value="${esc(filter.date)}" aria-label="Filter date"><select class="search-input" data-filter="method"><option value="all">All payments</option>${['Cash','Online','Paid','Pending'].map(o=>`<option value="${o}" ${filter.method===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="panel-head"><span class="panel-sub">${rs.length} wash records · Paid total ${money(sum)}</span><button class="textlink" data-action="reset-filters">Clear filters</button></div>${rs.length?table(rs):empty('No matching wash records','Adjust filters or add a new vehicle.')}</section>${dailyIncentiveRegister()}`;}
function dailyIncentiveRegister(){const dates=[...new Set(db.records.map(r=>r.date).filter(Boolean))].filter(d=>!filter.date||d===filter.date).sort((a,b)=>b.localeCompare(a));const workers=[...db.employees];const used=new Set(db.records.flatMap(r=>r.staff||[]));for(const id of used){if(!workers.some(e=>e.id===id))workers.push({id,name:'Former employee'});}let totals=Object.fromEntries(workers.map(e=>[e.id,0])),allCars=0,allAmount=0;const rows=dates.map(date=>{const results=dailyIncentives(date),cars=db.records.filter(r=>r.date===date).length,subtotal=workers.reduce((sum,e)=>sum+(results.totals[e.id]||0),0);allCars+=cars;allAmount+=subtotal;workers.forEach(e=>totals[e.id]+=(results.totals[e.id]||0));return `<tr><td><strong>${esc(date)}</strong></td><td>${cars}</td>${workers.map(e=>`<td>${money(results.totals[e.id]||0)}</td>`).join('')}<td><strong>${money(subtotal)}</strong></td></tr>`;}).join('');const grand=`<tr style="background:#fff8d7;font-weight:800"><td>Total</td><td>${allCars}</td>${workers.map(e=>`<td>${money(totals[e.id])}</td>`).join('')}<td>${money(allAmount)}</td></tr>`;return `<section class="panel" id="daily-incentive-register"><div class="panel-head"><div><h2>Daily Incentive Register</h2><p class="panel-sub" style="margin-top:5px">Date-wise washing count and worker incentive (₹)</p></div><button class="btn" data-action="export-incentive-csv" ${!dates.length?'disabled':''}>↓ Export Incentives CSV</button></div>${dates.length?`<div class="table-scroll"><table class="data-table incentive-table"><thead><tr><th>Date</th><th>Total Cars</th>${workers.map(e=>`<th>${esc(e.name)} (₹)</th>`).join('')}<th>Total Incentive (₹)</th></tr></thead><tbody>${rows}${grand}</tbody></table></div>`:empty('No incentive records yet','Save wash entries first. Each day will appear automatically here.')}<p class="faq" style="margin-top:13px">Calculated automatically using washing order and your slab rates: 1–10 ₹0, 11–15 ₹5, 16–20 ₹10, 21–25 ₹15, 26–30 ₹20 per car, per assigned worker. If a date filter is selected above, only that date appears here. Customer payment status does not affect incentives. Employees must be assigned to each vehicle to receive their incentive.</p></section>`;}
function exportIncentiveCSV(){const dates=[...new Set(db.records.map(r=>r.date).filter(Boolean))].filter(d=>!filter.date||d===filter.date).sort();const workers=[...db.employees];const used=new Set(db.records.flatMap(r=>r.staff||[]));for(const id of used){if(!workers.some(e=>e.id===id))workers.push({id,name:'Former employee'});}const columns=['Date','Total Cars',...workers.map(e=>e.name+' (INR)'),'Total Incentive (INR)'];const rows=dates.map(date=>{const item=dailyIncentives(date),amounts=workers.map(e=>item.totals[e.id]||0);return[date,db.records.filter(r=>r.date===date).length,...amounts,amounts.reduce((a,b)=>a+b,0)];});const summation=[ 'Total',rows.reduce((a,r)=>a+Number(r[1]),0),...workers.map((e,i)=>rows.reduce((a,r)=>a+Number(r[i+2]),0)),rows.reduce((a,r)=>a+Number(r[r.length-1]),0)];download('radhika_daily_incentives_'+dateLocal()+'.csv',[columns,...rows,summation].map(row=>row.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Daily incentive register exported.');}
function employees(){return heading('Employees','Manage worker profiles and salary components.',`<button class="btn" data-nav="attendance">▣ Attendance</button><button class="btn btn-primary" data-action="add-employee">＋ Add Employee</button>`)+`<div class="employee-grid">${db.employees.map(e=>{const count=db.records.filter(r=>(r.staff||[]).includes(e.id)&&r.date.startsWith(dateLocal().slice(0,7))).length;return `<div class="employee-card"><div class="avatar">${esc(e.name.slice(0,1).toUpperCase())}</div><div class="name">${esc(e.name)}</div><div class="summary">${e.active?'Active worker':'Inactive'} · ${esc(e.phone||'No mobile added')}</div><div class="metadata"><span>Base salary</span><strong>${money(e.salary)}</strong></div><div class="metadata"><span>Attendance bonus</span><strong>${money(e.attendanceBonus)}</strong></div><div class="metadata"><span>Performance bonus</span><strong>${money(e.performanceBonus)}</strong></div><div class="metadata"><span>Assigned washes (month)</span><strong>${count}</strong></div><button class="btn btn-sm" data-action="edit-employee" data-id="${e.id}" style="margin-top:15px;width:100%">Edit Employee</button></div>`}).join('')}</div><div class="tip" style="margin-top:12px">The salary range from your note is ₹5,000–₹6,000 basic, ₹1,000–₹1,500 attendance bonus and ₹1,000–₹1,500 performance bonus. Each employee's amounts are editable.</div>`;}
function attendance(){let counts={};db.employees.forEach(e=>{const m=Object.entries(db.attendance).filter(([d])=>d.startsWith(attDate.slice(0,7)));counts[e.id]={present:m.filter(([,statuses])=>statuses[e.id]==='Present').length,leave:m.filter(([,statuses])=>statuses[e.id]==='Paid Leave').length,absent:m.filter(([,statuses])=>statuses[e.id]==='Absent').length};});return heading('Employee Attendance','Track present days and the allowance of four paid leaves each month.',`<button class="btn" data-nav="payroll">View Payroll →</button>`)+`<section class="panel"><div class="field" style="max-width:270px"><label for="attDate">Attendance date</label><input id="attDate" type="date" value="${esc(attDate)}" data-action-change="attendance-date"></div><div class="attendance-grid" style="margin-top:20px">${db.employees.filter(e=>e.active).map(e=>{const status=(db.attendance[attDate]||{})[e.id]||'Not Marked',c=counts[e.id];return `<div class="attendance-box"><div class="avatar">${esc(e.name[0]||'E')}</div><strong>${esc(e.name)}</strong><select data-action-change="attendance-status" data-id="${e.id}">${['Not Marked','Present','Paid Leave','Absent'].map(x=>`<option ${status===x?'selected':''}>${x}</option>`).join('')}</select><p class="panel-sub">This month: ${c.present} present · ${c.leave} paid leave · ${c.absent} absent</p>${c.leave>4?'<span class="tag tag-pending">Over 4 paid leaves</span>':''}</div>`}).join('')}</div></section><div class="tip"><b>Paid leave policy:</b> 4 paid leaves per employee per month. The attendance screen records leave status; salary deductions are not automatically assumed. Enter any applicable deductions in Payroll after confirming your policy.</div>`;}
function payrollData(e){const k=payMonth+'|'+e.id;const p=db.payroll[k]||{attendance:false,performance:false,deduction:0};const inc=monthlyIncentives(payMonth)[e.id]||0;const total=Number(e.salary)+(p.attendance?Number(e.attendanceBonus):0)+(p.performance?Number(e.performanceBonus):0)+inc-(Number(p.deduction)||0);return{p,inc,total};}
function payroll(){const totals=db.employees.map(e=>payrollData(e).total).reduce((s,n)=>s+n,0);return heading('Salary & Incentives','Monthly payout calculation based on saved wash assignments.',`<button class="btn" data-nav="attendance">▣ Mark Attendance</button>`)+`<div class="panel"><div class="panel-head"><div class="field"><label>Salary month</label><input type="month" id="payMonth" value="${esc(payMonth)}" data-action-change="payroll-month"></div><div><span class="panel-sub">Total estimated payouts</span><div class="stat-value" style="font-size:28px">${money(totals)}</div></div></div><div class="payroll-list">${db.employees.map(e=>{const {p,inc,total}=payrollData(e);const attendance=Object.entries(db.attendance).filter(([d])=>d.startsWith(payMonth)),paidLeave=attendance.filter(([,v])=>v[e.id]==='Paid Leave').length,absent=attendance.filter(([,v])=>v[e.id]==='Absent').length;return `<div class="payroll-card"><div class="payroll-top"><div><div style="font-weight:850;font-size:17px">${esc(e.name)}</div><div class="panel-sub">Base ${money(e.salary)} + Incentives ${money(inc)} · Paid leaves ${paidLeave}/4 · Absences ${absent}</div></div><div class="payroll-amount">${money(total)}</div></div><div class="payroll-controls"><label class="checkline"><input type="checkbox" data-payfield="attendance" data-id="${e.id}" ${p.attendance?'checked':''}> Attendance bonus ${money(e.attendanceBonus)}</label><label class="checkline"><input type="checkbox" data-payfield="performance" data-id="${e.id}" ${p.performance?'checked':''}> Performance bonus ${money(e.performanceBonus)}</label><div class="field"><label>Other deduction (₹)</label><input type="number" min="0" step="1" value="${esc(p.deduction||0)}" data-payfield="deduction" data-id="${e.id}"></div></div></div>`}).join('')}</div></div><section class="panel"><div class="panel-head"><h2>Daily incentive slabs</h2></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Wash number (per day)</th><th>Incentive per assigned employee</th></tr></thead><tbody>${[['1–10','₹0'],['11–15','₹5 each'],['16–20','₹10 each'],['21–25','₹15 each'],['26–30','₹20 each'],['31–35','₹25 each']].map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td></tr>`).join('')}</tbody></table></div><p class="faq">Example: on 20 washes, one employee assigned to all 20 gets 5×₹5 + 5×₹10 = ₹75. Staff incentives accrue on completed washes even if customer payment is pending.</p></section><div class="tip">Attendance and performance bonuses are approved manually in this preview. No automatic bonus eligibility or salary deduction is assumed. You can record leave and deductions separately.</div>`;}
function business(){return heading('Services & Business Information','Quick access to your approved pricing, directions and customer sharing.')+`<div class="content-grid"><section class="panel"><div class="panel-head"><h2>Our Pricing</h2></div>${Object.entries(CATS).map(([k,v])=>`<div class="price-row"><span class="service-name">${esc(v)}</span><strong>${PRICES[k]===null?'Ask Price':money(PRICES[k])}</strong></div>`).join('')}<p class="faq">Complete car wash includes exterior foam washing, interior vacuum/dashboard cleaning and tyre polish.</p><button class="btn btn-primary" data-nav="wash">＋ Record a wash</button></section><section class="panel"><h2>Location & Customer Links</h2><p><b>Radhika Washing Center</b><br><span class="muted">Murlipur, Garh Road, Meerut, Uttar Pradesh</span></p><div class="shortcuts"><a class="shortcut" target="_blank" rel="noopener noreferrer" href="https://maps.app.goo.gl/ZRC5NJkP7nG2o6RE8">📍 Google Maps</a><a class="shortcut" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=Radhika%20Washing%20Center%2C%20Murlipur%2C%20Garh%20Road%2C%20Meerut.%20Complete%20car%20wash%20starts%20at%20Rs%20249.">🟢 Share via WhatsApp</a></div><p class="faq">Customer reviews are not fabricated in the demo. Connect a verified Google Business Profile to show genuine reviews in a production app.</p></section></div>`;}
function settings(){return heading('Google Drive & Phone Backup','Offline-first • automatic Drive backup after Google sign-in.')+cloudSettingsPanel()+`<div class="content-grid"><section class="panel"><h2>Device Storage & Backups</h2><p class="faq"><b>Storage:</b> <span id="storageStatus">${window.AndroidStorage?'Android SQLite local database':storageReady?'IndexedDB local database':'Local browser storage fallback'}</span>. Records do not need internet. Google Drive backup requires setup and an active Google session. Chrome/app data clearing, browser changes, or app uninstall may erase these records. Export a separate JSON backup regularly until Google Drive status confirms Successful Sync, and before major upgrades.</p><div class="tip"><b>Important:</b> Backups may include customer phone numbers and employee details. Store them privately. Use only on your own trusted phone.</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin:14px 0"><button class="btn btn-primary" data-action="export-json">↓ Full JSON Backup</button><button class="btn" data-action="restore-json">↑ Restore Backup</button><button class="btn" data-action="export-csv">↓ Wash Records CSV</button></div><input id="restoreInput" type="file" accept="application/json,.json" style="display:none" aria-label="Select backup JSON file"><p class="faq">A restore replaces the current dataset after confirmation. Export the current backup before restoring older data.</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-red" data-action="clear-all">Clear All Washes</button><button class="btn" data-action="load-demo">Load Sample Data</button></div></section><section class="panel"><h2>Incentive Rules</h2><p class="faq">1–10 washes ₹0; 11–15 ₹5; 16–20 ₹10; 21–25 ₹15; 26–30 ₹20 per assigned employee per wash. Subsequent 5-wash slabs increase by ₹5. Counting restarts each day.</p><div class="field"><label>Working-day reference</label><input type="number" min="1" max="31" id="workDays" value="${esc(db.settings.workingDays||26)}" data-action-change="work-days"></div><p class="faq">4 paid leaves each month; attendance and performance bonuses are approved manually in Payroll. Monthly base salary is editable per employee.</p></section></div>`;}

function render(){updateCloudBadge();const navFn={dashboard,wash,records,employees,attendance,payroll,business,settings};$('#sideNav').innerHTML=navButtons();$('#mobileNav').innerHTML=mobileButtons();$('#view').innerHTML=(navFn[view]||dashboard)();}
function validation(){const no=draft.carNo.replace(/\s+/g,'').toUpperCase();if(!no)return'Please enter car registration number.';if(!(/^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{1,4}$/.test(no)||/^\d{2}BH\d{4}[A-Z]{1,2}$/.test(no)))return'Check registration number. Example: UP15 AB 1234 or 22 BH 1234 AA.';if(!draft.date||!draft.time)return'Select wash date and time.';if(!Number.isFinite(Number(draft.price))||Number(draft.price)<=0)return draft.category==='custom'?'Please enter custom vehicle price.':'Please enter a valid price above ₹0.';if(db.employees.some(e=>e.active)&&!(draft.staff||[]).length)return'Select at least one employee for the wash record.';if(draft.phone.trim()&&!/^\d{10}$/.test(draft.phone.replace(/\D/g,'')))return'Customer mobile should contain 10 digits, or leave it blank.';return'';}
function saveWash(){formError=validation();if(formError){render();$('#carNo')?.focus();return;}const no=draft.carNo.toUpperCase().replace(/\s+/g,'');const isEdit=!!draft.id;const duplicate=db.records.some(r=>r.id!==draft.id&&r.date===draft.date&&r.carNo.replace(/\s+/g,'')===no);if(duplicate&&!confirm('This vehicle already has a wash entry today. Add another entry anyway?'))return;let rec={...draft,customerName:String(draft.customerName||'').trim(),carNo:no,price:Number(draft.price),phone:draft.phone.replace(/\D/g,''),created:Date.now(),id:draft.id||uid(),demo:false};if(isEdit){const old=db.records.find(r=>r.id===rec.id);if(old){rec.created=old.created;rec.receiptNo=old.receiptNo;}db.records=db.records.map(r=>r.id===rec.id?rec:r);}else {ensureReceiptNumbers(db);rec.receiptNo=db.settings.nextReceiptNo++;db.records.unshift(rec);}persist();draft=null;filter={search:'',date:'',method:'all'};view='records';render();toast(isEdit?'Wash record updated.':'Wash record saved.');}
function download(name,content,type){if(window.AndroidStorage){AndroidStorage.saveFile(name,content,type);return;}const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function csvValue(v){let s=String(v==null?'':v);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){const columns=['Receipt No.','Date','Time','Registration','Customer Name','Category','Service','Price','Payment Method','Payment Status','Employees','Customer Mobile','Notes'];const data=db.records.map(r=>[r.receiptNo||'',r.date,r.time,r.carNo,r.customerName||'',CATS[r.category],r.service,r.price,r.method,r.status,(r.staff||[]).map(id=>db.employees.find(e=>e.id===id)?.name||'Former Employee').join('; '),r.phone||'',r.notes||'']);download('radhika_wash_records_'+dateLocal()+'.csv',[columns,...data].map(row=>row.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported.');}
function openEmployee(id){editingEmployee=id||null;const e=id?db.employees.find(x=>x.id===id):{name:'',phone:'',salary:6000,attendanceBonus:1000,performanceBonus:1000,joined:dateLocal(),active:true};if(!e)return;$('#modalRoot').innerHTML=`<div class="dialog-backdrop"><div class="dialog"><div class="dialog-top"><div><h2 style="margin:0">${id?'Edit':'Add'} Employee</h2><p class="panel-sub">Update worker details and salary</p></div><button class="close-btn" data-action="close-modal">×</button></div><form id="employeeForm" class="form-grid" style="margin-top:18px"><div class="field span-2"><label>Name *</label><input name="name" required maxlength="60" value="${esc(e.name)}"></div><div class="field span-2"><label>Mobile number</label><input name="phone" inputmode="tel" maxlength="15" value="${esc(e.phone)}"></div><div class="field"><label>Basic salary (₹)</label><input name="salary" type="number" min="0" required value="${e.salary}"></div><div class="field"><label>Joining date</label><input name="joined" type="date" required value="${esc(e.joined)}"></div><div class="field"><label>Attendance bonus (₹)</label><input name="attendanceBonus" type="number" min="0" required value="${e.attendanceBonus}"></div><div class="field"><label>Performance bonus (₹)</label><input name="performanceBonus" type="number" min="0" required value="${e.performanceBonus}"></div><div class="field span-2"><label class="checkline"><input type="checkbox" name="active" ${e.active?'checked':''}> Active employee</label></div><div class="span-2 form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Save Employee</button></div></form></div></div>`;}
function saveEmployee(form){const v=new FormData(form),name=String(v.get('name')||'').trim(),phone=String(v.get('phone')||'').replace(/\D/g,'');if(!name)return toast('Enter employee name.');if(phone.length&&phone.length!==10)return toast('Enter 10-digit mobile or leave it blank.');let e={id:editingEmployee||uid(),name,phone,salary:Number(v.get('salary'))||0,attendanceBonus:Number(v.get('attendanceBonus'))||0,performanceBonus:Number(v.get('performanceBonus'))||0,joined:String(v.get('joined')),active:v.has('active')};if(editingEmployee)db.employees=db.employees.map(x=>x.id===editingEmployee?e:x);else db.employees.push(e);persist();$('#modalRoot').innerHTML='';render();toast('Employee saved.');}
function receiptDate(r){const p=String(r.date||'').split('-');const day=p.length===3?`${p[2]}-${p[1]}-${p[0]}`:String(r.date||'');return day+(r.time?'  '+r.time:'');}
function receiptCanvas(r){
  const c=document.createElement('canvas');c.width=1080;c.height=1430;
  const x=c.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,c.width,c.height);
  const left=85,right=995;
  function txt(text,px,y,weight='400',align='left',xx=left){x.font=weight+' '+px+'px Arial, sans-serif';x.textAlign=align;x.textBaseline='alphabetic';x.fillStyle='#111111';x.fillText(String(text),xx,y);}
  function line(y){x.beginPath();x.moveTo(left,y);x.lineTo(right,y);x.strokeStyle='#CCCCCC';x.lineWidth=2;x.stroke();}
  function wrap(text,maxWidth,fontPx,weight='400'){
    x.font=weight+' '+fontPx+'px Arial, sans-serif';const words=String(text||'—').split(/\s+/),lines=[];let current='';
    for(const word of words){const test=current?current+' '+word:word;if(x.measureText(test).width>maxWidth&&current){lines.push(current);current=word;}else current=test;}
    if(current)lines.push(current);return lines.length?lines:['—'];
  }
  txt('RADHIKA',75,132,'800');txt('WASHING CENTER',43,185,'700');
  txt('Murlipur, Garh Road, Meerut (U.P.)',27,244,'400');
  line(278);
  txt('CAR WASH RECEIPT',43,349,'800');
  txt('RECEIPT NO.',25,408,'700');txt(String(r.receiptNo||'—'),42,408,'800','right',right);
  txt('DATE & TIME',24,464,'700');txt(receiptDate(r),28,464,'400','right',right);
  line(505);
  let y=570;
  txt('CUSTOMER & VEHICLE',29,y,'800');y+=65;
  function row(label,value){
    txt(label.toUpperCase(),24,y,'700');
    const parts=wrap(value,550,29,'500');
    parts.forEach((v,i)=>txt(v,29,y+i*38,'500','right',right));
    y+=Math.max(57,parts.length*38+16);
  }
  row('Customer',r.customerName||'Walk-in Customer');
  row('Vehicle Number',r.carNo||'—');
  row('Vehicle Category',CATS[r.category]||r.category||'—');
  line(y+8);y+=72;
  txt('SERVICE',29,y,'800');y+=59;
  for(const part of wrap(r.service||'Complete Car Wash',840,29,'500')){txt(part,29,y,'500');y+=40;}
  line(y+18);y+=90;
  txt('TOTAL AMOUNT',31,y,'800');txt(money(r.price),57,y+4,'800','right',right);
  y+=81;txt('PAYMENT',24,y,'700');txt((r.method||'Cash')+'  /  '+(r.status||'Pending'),28,y,'500','right',right);
  const footY=Math.max(y+80,1294);line(footY-36);
  txt('Thank you for choosing Radhika Washing Center!',27,footY+18,'500','center',540);
  txt('We look forward to serving you again.',24,footY+59,'400','center',540);
  // Pure white background, black typography: the same image is shared and printed.
  return c;
}
function receiptImageName(r){return 'Radhika_Receipt_'+String(r.receiptNo||'unknown')+'.png';}
function printReceipt(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  lastReceipt=r;
  const png=receiptCanvas(r).toDataURL('image/png');
  const img=document.createElement('img');img.src=png;img.alt='Car wash receipt '+r.receiptNo;
  const paper=$('#receiptPrint');paper.innerHTML='';paper.appendChild(img);
  $('#modalRoot').innerHTML=`<div class="dialog-backdrop"><div class="dialog receipt-dialog"><div class="dialog-top"><div><h2 style="margin:0">Receipt #${esc(r.receiptNo)}</h2><p class="panel-sub">${esc(r.carNo)} · ${esc(r.date)} · ${money(r.price)}</p></div><button class="close-btn" data-action="close-modal" aria-label="Close">×</button></div><p class="faq" style="margin:9px 0 12px">White background • Black text • Shareable PNG image</p><div class="receipt-preview"><img alt="Preview of receipt number ${esc(r.receiptNo)}" src="${png}"></div><div class="receipt-controls"><button class="btn btn-primary" data-action="share-receipt">↗ Share Image on WhatsApp</button><button class="btn" data-action="download-receipt">↓ Save PNG Image</button><button class="btn" data-action="print-receipt">🖨 Print Receipt</button><button class="btn" data-action="close-modal">Close</button></div></div></div>`;
}
function receiptBlob(r){return new Promise((resolve,reject)=>{receiptCanvas(r).toBlob(b=>b?resolve(b):reject(new Error('Image creation failed')),'image/png');});}
async function shareReceipt(){
  if(!lastReceipt)return;
  const r=lastReceipt;const filename=receiptImageName(r);
  try{
    // Native Android app shares content:// URI with WhatsApp via standard Android Sharesheet.
    if(window.AndroidStorage&&typeof AndroidStorage.shareReceiptImage==='function'){
      AndroidStorage.shareReceiptImage(receiptCanvas(r).toDataURL('image/png'),filename);
      return;
    }
    const blob=await receiptBlob(r),file=new File([blob],filename,{type:'image/png'});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({files:[file],title:'Radhika Washing Center Receipt #'+r.receiptNo});
      return;
    }
    // file:// Chrome may not support Web Share files. Download actual PNG instead of a text-only WhatsApp link.
    downloadReceipt();
    toast('PNG saved. Open WhatsApp → Attach → Gallery/Documents → select the image.');
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);downloadReceipt();toast('Sharing unavailable. PNG saved; attach it in WhatsApp.');}
}
function downloadReceipt(){
  if(!lastReceipt)return;
  const filename=receiptImageName(lastReceipt),png=receiptCanvas(lastReceipt).toDataURL('image/png');
  if(window.AndroidStorage&&typeof AndroidStorage.saveReceiptImage==='function'){
    AndroidStorage.saveReceiptImage(png,filename);return;
  }
  const a=document.createElement('a');a.href=png;a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
function confirmDelete(id){const r=db.records.find(x=>x.id===id);if(!r||!confirm(`Delete wash record for ${r.carNo}? This changes the day's incentives.`))return;db.records=db.records.filter(x=>x.id!==id);persist();render();toast('Wash record deleted.');}
function handleClick(e){const navEl=e.target.closest('[data-nav]');if(navEl){nav(navEl.dataset.nav);return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id,val=el.dataset.val;
switch(a){case'cloud-save-client':saveCloudClient();break;case'cloud-connect':connectGoogleDrive();break;case'cloud-sync':syncCloud(true);break;case'cloud-disconnect':disconnectCloud();break;case'cloud-conflict-phone':resolveCloudConflict('phone');break;case'cloud-conflict-drive':resolveCloudConflict('drive');break;case'category':draft.category=val;draft.price=PRICES[val]===null?'':String(PRICES[val]);formError='';render();break;case'method':case'status':draft[a]=val;render();break;case'staff':draft.staff=draft.staff.includes(id)?draft.staff.filter(x=>x!==id):[...draft.staff,id];render();break;case'clear-draft':draft=newDraft();formError='';render();break;case'save-wash':saveWash();break;case'edit-record':{const r=db.records.find(x=>x.id===id);if(r){draft={...r,price:String(r.price)};nav('wash');}break;}case'delete-record':confirmDelete(id);break;case'receipt':printReceipt(id);break;case'print-receipt':if(window.AndroidStorage){AndroidStorage.printPage();}else{window.print();}break;case'share-receipt':shareReceipt();break;case'download-receipt':downloadReceipt();break;case'close-modal':$('#modalRoot').innerHTML='';break;case'add-employee':openEmployee();break;case'edit-employee':openEmployee(id);break;case'export-csv':exportCSV();break;case'export-incentive-csv':exportIncentiveCSV();break;case'show-incentives':$('#daily-incentive-register')?.scrollIntoView({behavior:'smooth',block:'start'});break;case'export-json':download('Radhika_Full_Backup_'+dateLocal()+'.json',JSON.stringify({...db,backupVersion:1,backupCreated:new Date().toISOString()},null,2),'application/json');toast('Full backup exported to Downloads.');break;case'restore-json':$('#restoreInput')?.click();break;case'reset-filters':filter={search:'',date:'',method:'all'};render();break;case'clear-all':if(confirm('Clear ALL wash records from this browser? This cannot be undone unless you exported a backup.')){db.records=[];db.attendance={};db.payroll={};db.demo=false;persist();render();toast('Wash records cleared.');}break;case'load-demo':if(confirm('Replace current demo records, employees and attendance with sample data? Export a backup first if needed.')){db=ensureReceiptNumbers(sample());persist();render();toast('Demo data loaded.');}break;case'more':$('#modalRoot').innerHTML=`<div class="dialog-backdrop"><div class="dialog"><div class="dialog-top"><h2 style="margin:0">More Pages</h2><button class="close-btn" data-action="close-modal">×</button></div><div class="nav-group" style="margin-top:15px">${NAV.map(([v,ic,t])=>`<button class="nav-button" data-nav="${v}">${ic} &nbsp; ${esc(t)}</button>`).join('')}</div></div></div>`;break;}}
function handleInput(e){const d=e.target.dataset;if(d.draft&&draft){draft[d.draft]=e.target.value;formError='';}if(d.filter){filter[d.filter]=e.target.value;const active=document.activeElement;const sel=active?.selectionStart;render();const i=$(`[data-filter="${d.filter}"]`);if(i){i.focus();if(d.filter==='search'&&typeof sel==='number')i.setSelectionRange(sel,sel);}}}
function handleChange(e){const d=e.target.dataset;if(d.actionChange==='attendance-date'){attDate=e.target.value;render();}else if(d.actionChange==='attendance-status'){db.attendance[attDate]=db.attendance[attDate]||{};db.attendance[attDate][d.id]=e.target.value;persist();render();toast('Attendance updated.');}else if(d.actionChange==='payroll-month'){payMonth=e.target.value;render();}else if(d.actionChange==='work-days'){db.settings.workingDays=Number(e.target.value)||26;persist();toast('Reference updated.');}else if(d.payfield){const k=payMonth+'|'+d.id;db.payroll[k]=db.payroll[k]||{attendance:false,performance:false,deduction:0};db.payroll[k][d.payfield]=e.target.type==='checkbox'?e.target.checked:Math.max(0,Number(e.target.value)||0);persist();render();}else if(d.filter&&e.target.tagName==='SELECT'){filter[d.filter]=e.target.value;render();}}
document.addEventListener('click',handleClick);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);document.addEventListener('submit',e=>{if(e.target.id==='employeeForm'){e.preventDefault();saveEmployee(e.target);}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';});
document.addEventListener('change',async e=>{if(e.target.id!=='restoreInput')return;const f=e.target.files?.[0];if(!f)return;e.target.value='';if(f.size>15*1024*1024)return toast('Backup is too large (max 15 MB).');try{const data=JSON.parse(await f.text());if(!isValidState(data))throw new Error('Invalid data structure');if(!confirm('Restore full backup? This will REPLACE current washes, employees, attendance and salaries. Export a backup of current records first.'))return;db=ensureReceiptNumbers({employees:data.employees,records:data.records,attendance:data.attendance,payroll:data.payroll,settings:{workingDays:26,...data.settings},demo:!!data.demo});persist();draft=null;view='dashboard';render();await writeQueue;toast('Backup restored. Verify your records.');}catch(error){toast('Could not restore this JSON backup.');console.error(error);}});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();boot();
})();
</script></body></html>
