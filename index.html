async function connectGoogleDrive(){

  cloud.authPending=true;
  cloud.error='';

  let successReceived=false;
  const finish=()=>{cloud.authPending=false;};

    const client=google.accounts.oauth2.initTokenClient({
      client_id:cloudCfg.clientId,

      callback:async response=>{
        finish();

        }
      },
      error_callback:err=>{

        // It must not change a successful login into a failure.
        if(successReceived||cloud.token&&Date.now()<cloud.expiresAt-10000)return;

          ?'Google window closed before an access token reached the app. This can happen after Allow if the popup callback fails; retry in Chrome.'

  }else{
    try{localStorage.setItem(PHONE_RECOVERY_KEY,JSON.stringify(entry));}
    catch(e){throw new Error('Cannot create a safety copy on this phone. Export a Full JSON Backup first.');}
  }

}
async function replacePhoneStateSafely(next){

async function uploadCloud(file,previous){
 await writeQueue;
 const snapshot=JSON.parse(JSON.stringify(db)),signature=cloudFingerprint(snapshot),dataJSON=JSON.stringify(snapshot);
 const checksum=await sha256Text(dataJSON);
 const doc=JSON.stringify({format:'RadhikaWashingCenter',schemaVersion:3,savedAt:new Date().toISOString(),source:'one-phone-pwa',integrity:{algorithm:'SHA-256',sha256:checksum},data:snapshot});
 if(doc.length>4*1024*1024)throw new Error('Backup is too large for a single upload. Export JSON and check storage.');
 // Save former Drive copy before overwriting main file on a new day or large record decrease.
 if(file&&previous){const today=dateLocal();if(cloudCfg.backupDay!==today||previous.data.records.length>snapshot.records.length+5||cloudCfg.receiptResetPendingReview){
   const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/T/,'_').slice(0,15);
   const recovery=await driveCreate('Radhika_Recovery_'+stamp+'_'+uid()+'.json',previous.raw);
   const checkOld=await driveRead(recovery.id);
   if(checkOld.fingerprint!==previous.fingerprint)throw new Error('Pre-overwrite recovery copy could not be verified. Main backup unchanged.');
   cloudCfg.backupDay=today;cloudConfigSave();
 }}
 const uploaded=file?await driveUpdate(file.id,doc):await driveCreate(CLOUD_DATA_NAME,doc);
 // Read back from Drive and verify the exact saved data before reporting success.
 const checked=await driveRead(uploaded.id);
 if(!checked.verified||checked.fingerprint!==signature)throw new Error('Drive upload verification failed. Keep phone data and try again.');
 cloudCfg.fileId=uploaded.id;cloudCfg.lastRemoteVersion=String(uploaded.version||'');
 cloudCfg.lastRemoteFingerprint=signature;cloudCfg.lastSyncedFingerprint=signature;
 cloudCfg.lastSyncAt=new Date().toISOString();cloudCfg.lastVerifiedAt=cloudCfg.lastSyncAt;
 backupHealth.verification='SHA-256 integrity passed';cloudConfigSave();
 try{await driveDailySnapshot(doc,signature);}catch(err){cloud.error='Main backup verified, but daily snapshot failed: '+String(err.message||err);console.warn('Daily snapshot problem',err);}
 cloud.status='Synced';toast(cloud.error?'Live Drive backup verified; daily snapshot needs retry.':'Google Drive backup verified and saved.');
}
async function syncCloud(manual=false){if(cloud.busy){cloud.changedDuringSync=true;return;}if(!cloud.token){if(manual)toast('Connect Google Drive first.');return;}if(cloud.conflict){if(manual)showCloudConflict();return;}if(!navigator.onLine){if(manual)toast('Offline: saved to phone. Drive sync will resume online.');return;}cloud.busy=true;cloud.error='';cloud.changedDuringSync=false;updateCloudBadge();try{const file=await driveFind();if(!file){if(cloudCfg.receiptResetPendingReview)throw new Error('Receipt reset pending: old Drive backup was not found. Verify backup and resolve receipt numbering before uploading.');if(cloudCfg.fileId){throw new Error('Your previous Drive backup is missing or was deleted. Export a local JSON backup, then reconnect after checking Drive.');}await uploadCloud(null,null);return;}const remote=await driveRead(file.id);const localSignature=cloudFingerprint(db);const localClean=!!cloudCfg.lastSyncedFingerprint&&localSignature===cloudCfg.lastSyncedFingerprint;

if(isEmptyPhoneState(db)&&!cloudCfg.lastSyncedFingerprint){await receiveCloudData(remote,file,{automatic:true});return;}

function toB64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}

async function encryptedBackupExport(){

async function parseLocalBackup(file){

 const raw=JSON.parse(await file.text());let d=raw?.data||raw,verified=false;
 if(raw?.type==='RadhikaEncryptedBackup'){
   if(!crypto?.subtle)throw new Error('Encrypted restore requires HTTPS / secure browser.');
   const pass=await askEncryptedBackupPassword(false);if(pass===null)throw new Error('Password entry cancelled.');
   const key=await backupKey(pass,fromB64(raw.salt));
   let bytes;try{bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(raw.iv)},key,fromB64(raw.ciphertext));}catch(e){throw new Error('Wrong password or corrupted encrypted file.');}
   d=JSON.parse(new TextDecoder().decode(bytes));verified=true;

 if(!isValidState(d))throw new Error('Invalid Radhika backup format.');
 if(raw?.integrity?.sha256){if(await sha256Text(JSON.stringify(d))!==raw.integrity.sha256)throw new Error('Backup checksum mismatch.');verified=true;}

function finalDailyIncentives(date){const raw=dailyIncentives(date);const overrides=db.incentiveOverrides?.[date]||{};const totals={...raw.totals};const adjusted={};for(const [id,item] of Object.entries(overrides)){if(item&&Number.isFinite(Number(item.amount))&&Number(item.amount)>=0){totals[id]=Number(item.amount);adjusted[id]=true;}}return{totals,autoTotals:raw.totals,adjusted,details:raw.details};}
function monthlyIncentives(month){const dates=new Set(db.records.filter(r=>r.date.startsWith(month)).map(r=>r.date));Object.keys(db.incentiveOverrides||{}).filter(d=>d.startsWith(month)).forEach(d=>dates.add(d));let result={};for(const date of dates){const t=finalDailyIncentives(date).totals;Object.entries(t).forEach(([id,n])=>result[id]=(result[id]||0)+n);}return result;}
function incentiveWorkers(dates){const workers=[...db.employees];const used=new Set(db.records.flatMap(r=>r.staff||[]));for(const d of dates){Object.keys(db.incentiveOverrides?.[d]||{}).forEach(id=>used.add(id));}for(const id of used){if(!workers.some(e=>e.id===id))workers.push({id,name:'Former employee',active:false});}return workers;}
function incentiveDates(){const dates=new Set(db.records.map(r=>r.date).filter(Boolean));Object.keys(db.incentiveOverrides||{}).forEach(d=>dates.add(d));return[...dates].filter(d=>(!filter.date||d===filter.date)&&(!incMonth||d.startsWith(incMonth))).sort((a,b)=>b.localeCompare(a));}
function recordRows(records,opts={}){return records.map(r=>`<tr><td><strong>#${esc(r.receiptNo||'—')}</strong></td><td><div class="vehicle-no">${esc(r.carNo)}</div><span class="muted" style="font-size:11px">${esc(r.date)} · ${esc(r.time)}</span></td><td>${esc(r.customerName||'—')}</td><td>${esc(CATS[r.category]||r.category)}${r.demo?' <span class="tag tag-demo">Sample</span>':''}</td><td>${money(r.price)}</td><td>${esc(r.method)}</td><td><span class="tag ${r.status==='Paid'?'tag-paid':'tag-pending'}">${esc(r.status)}</span></td>${opts.noActions?'':`<td><div class="actions"><button class="link-btn" data-action="receipt" data-id="${r.id}">Receipt</button><button class="link-btn" data-action="edit-record" data-id="${r.id}">Edit</button><button class="link-btn danger" data-action="delete-record" data-id="${r.id}">Delete</button></div></td>`}</tr>`).join('');}
function table(rs,opts={}){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Receipt No.</th><th>Vehicle / Date</th><th>Customer</th><th>Category</th><th>Amount</th><th>Payment</th><th>Status</th>${opts.noActions?'':'<th>Actions</th>'}</tr></thead><tbody>${recordRows(rs,opts)}</tbody></table></div>`;}

orked on this car</span></div><div class="staff-checks">${db.employees.filter(e=>e.active||(d.staff||[]).includes(e.id)).map(e=>{const selected=(d.staff||[]).includes(e.id),allowed=isAssignmentAllowed(e,d.date),historical=selected&&assignedEarlier(e,d.date,d.id),locked=!allowed;const status=attendanceStatus(e.id,d.date);return `<button type="button" class="staff-chip ${selected?'active':''} ${locked?'staff-chip-disabled':''}" data-action="staff" data-id="${esc(e.id)}" ${locked?'disabled':''} title="${locked?(historical?'Previously assigned; kept for this old record. Change attendance to edit.':status==='Not Marked'?'Not marked':status):status}"><span class="tick">${selected?'✓':''}</span><span>${esc(e.name)}<small class="staff-meta">${locked?(historical?'Earlier assigned · '+esc(status):esc(status)):status==='Half Day'?'Half Day':status==='Not Marked'?'Attendance not marked':'Present'}</small></span></button>`;}).join('')}</div><p class="faq">Absent / Paid Leave workers cannot be newly assigned. Half Day workers can be assigned. Not Marked workers are allowed with a warning. Previously saved assignments are preserved even if attendance changes later.</p>${db.employees.some(e=>e.active&&attendanceStatus(e.id,d.date)==='Not Marked')?'<p class="notice" style="margin-top:8px">Some employees have no attendance marked for this date. Check Attendance before assigning them.</p>':''}<div class="field"><label for="washNotes">Notes (optional)</label><textarea id="washNotes" data-draft="notes" placeholder="Special service, customer request...">${esc(d.notes)}</textarea></div>${formError?`<p class="message" role="alert">${esc(formError)}</p>`:''}<div class="form-actions"><button class="btn" data-action="clear-draft">Clear</button><button class="btn btn-primary" data-action="save-wash">✓ ${d.id?'Update':'Save'} Wash Record</button></div></div></div><div><div class="panel"><h2>Entry Summary</h2><div class="price-row"><span>Vehicle</span><strong style="font-size:14px">${esc(CATS[d. function dailyIncentiveRegister(){

  }).join('');

  const history=(db.incentiveHistory||[]).filter(h=>(!filter.date||h.date===filter.date)&&(!incMonth||h.date.startsWith(incMonth))).slice(-6).reverse();
  return `<section class="panel" id="daily-incentive-register"><div class="panel-head"><div><h2>Daily Incentive Register</h2><p class="panel-sub" style="margin-top:5px">Auto-calculated incentives, editable final amounts & monthly salary integration.</p></div><button class="btn" data-action="export-incentive-csv" ${!dates.length?'disabled':''}>↓ Incentive CSV</button></div>

    <p class="faq" style="margin-top:14px">Automatic slabs per assigned worker: cars 1–10 ₹0; 11–15 ₹5; 16–20 ₹10; 21–25 ₹15; 26–30 ₹20. Tap Edit to adjust any worker's final daily amount. Manual amounts are included in Salary & Incentives. Changes are recorded in history.</p>
    ${history.length?`<details class="inc-history"><summary>Recent incentive edit history (${(db.incentiveHistory||[]).length} total)</summary>${history.map(h=>`<div class="inc-history-row"><b>${esc(h.date)}</b> · ${esc(h.workerName||db.employees.find(e=>e.id===h.employeeId)?.name||'Worker')} · ${money(h.from)} → <b>${money(h.to)}</b><span class="muted">${esc(h.reason||'Manual adjustment')} · ${esc(String(h.updatedAt||'').replace('T',' ').slice(0,16))}</span></div>`).join('')}</details>`:''}
  </section>`;
}
function exportIncentiveCSV(){const dates=incentiveDates().slice().sort(),workers=incentiveWorkers(dates);const columns=['Date','Total Cars',...workers.map(e=>e.name+' Final (INR)'),'Auto Total (INR)','Final Total (INR)','Manual Edits'];const rows=dates.map(date=>{const item=finalDailyIncentives(date),amounts=workers.map(e=>item.totals[e.id]||0),auto=workers.reduce((s,e)=>s+(item.autoTotals[e.id]||0),0);return[date,db.records.filter(r=>r.date===date).length,...amounts,auto,amounts.reduce((a,b)=>a+b,0),workers.filter(e=>item.adjusted[e.id]).length];});const total=['Total',rows.reduce((a,r)=>a+Number(r[1]),0),...workers.map((e,i)=>rows.reduce((a,r)=>a+Number(r[i+2]),0)),...[-3,-2,-1].map(i=>rows.reduce((a,r)=>a+Number(r.at(i)),0))];download('radhika_daily_incentives_'+dateLocal()+'.csv',[columns,...rows,total].map(row=>row.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Incentive CSV exported.');}

function updateIncentiveEditorTotal(){const form=$('#incentiveForm');if(!form)return;const total=[...form.querySelectorAll('[data-incentive-worker]')].reduce((s,el)=>s+(Number(el.value)||0),0);const target=$('#incentiveEditTotal');if(target)target.textContent=money(total);}
function saveIncentiveAdjustments(form){
  const date=form.dataset.date;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Invalid date.');
  const inputs=[...form.querySelectorAll('[data-incentive-worker]')],reason=String(new FormData(form).get('reason')||'').trim().slice(0,160),original=dailyIncentives(date).totals;
  const pending=[];
  for(const input of inputs){const id=input.dataset.incentiveWorker,value=Number(input.value),auto=Number(original[id]||0);if(input.value.trim()===''||!Number.isFinite(value)||value<0||value>100000||Math.round(value*100)!==value*100){toast('Enter valid non-negative incentive amounts (up to 2 decimals).');input.focus();return;}
    const previous=db.incentiveOverrides?.[date]?.[id],old=previous?Number(previous.amount):auto;
    const willOverride=Math.abs(value-auto)>.00001,hadOverride=!!previous;
    if((Math.abs(value-old)>.00001)||(hadOverride!==willOverride))pending.push({id,value,auto,old,willOverride});
  }
  if(!pending.length){$('#modalRoot').innerHTML='';toast('No changes to save.');return;}
  if(!db.incentiveOverrides[date])db.incentiveOverrides[date]={};
  for(const item of pending){if(item.willOverride){db.incentiveOverrides[date][item.id]={amount:item.value,reason:reason||'Manual adjustment',updatedAt:new Date().toISOString()};}else delete db.incentiveOverrides[date][item.id];
    const name=db.employees.find(e=>e.id===item.id)?.name||'Former employee';
    db.incentiveHistory.push({id:uid(),date,employeeId:item.id,workerName:name,auto:item.auto,from:item.old,to:item.value,action:item.willOverride?'Manual override':'Reset to automatic',reason:reason||(item.willOverride?'Manual adjustment':'Reset to automatic'),updatedAt:new Date().toISOString()});
  }
  if(!Object.keys(db.incentiveOverrides[date]).length)delete db.incentiveOverrides[date];

function receiptResetEligibility(){
 const problems=[];
 if(db.records.length)problems.push(db.records.length+' saved wash record(s)');
 const redemptions=(db.memberships||[]).reduce((s,m)=>s+(Array.isArray(m.redeemed)?m.redeemed.length:0),0);
 if(redemptions)problems.push(redemptions+' membership redemption(s)');
 if((db.loyaltyClaims||[]).length)problems.push(db.loyaltyClaims.length+' loyalty redemption(s)');
 // These indicate another record might refer to a receipt already issued.
 if((db.closings||[]).some(x=>Number(x.countedCash)>0))problems.push('daily closing(s) with counted cash');
 if(db.settings.receiptNumbersLocked)problems.push('receipt numbering locked after real receipts');
 return problems;
}

let resetReceiptBusy=false;
async function resetReceiptCounterSafely(){
 if(resetReceiptBusy)return;
 if(!$('#receiptResetCertify')?.checked||($('#receiptResetKeyword')?.value||'').trim()!=='RESET')return toast('Read and complete both confirmation steps.');
 const problems=receiptResetEligibility();if(problems.length)return toast('Reset blocked: '+problems.join(', '));
 const oldNext=Math.max(1,Number(db.settings.nextReceiptNo)||1);
 if(oldNext<=1)return toast('Receipt counter is already #1.');
 if(cloud.busy)return toast('Wait until current Google Drive operation finishes.');
 if(!confirm('FINAL CONFIRMATION: No real receipt was ever issued. Reset next receipt #'+oldNext+' to #1?'))return;
 resetReceiptBusy=true;
 const oldReview=!!cloudCfg.receiptResetPendingReview;
 try{
  // Ensure all previous writes have finished, then create and verify a durable safety copy.
  await writeQueue;
  const safety=await savePhoneSafetyCopy('Before receipt number reset #'+oldNext+' to #1 (test data only)');
  const saved=await refreshSafetyCopyStatus();
  if(!saved||saved.id!==safety.id||Number(saved.data?.settings?.nextReceiptNo)!==oldNext)throw new Error('Safety copy verification failed; counter was not changed.');
  const next=JSON.parse(JSON.stringify(db));
  next.settings.nextReceiptNo=1;
  next.settings.receiptResetHistory=Array.isArray(next.settings.receiptResetHistory)?next.settings.receiptResetHistory:[];
  const event={at:new Date().toISOString(),before:oldNext,after:1,source:'manual test-only reset',safetyCopyId:safety.id};
  next.settings.receiptResetHistory.push(event);
  next.activityLog=Array.isArray(next.activityLog)?next.activityLog:[];
  next.activityLog.unshift({id:uid(),at:event.at,action:'Receipt counter reset',detail:'#'+oldNext+' to #1; test data only; phone recovery '+safety.id});
  next.activityLog=next.activityLog.slice(0,800);
  const validate=ensureReceiptNumbers(next);
  if(validate.settings.nextReceiptNo!==1)throw new Error('Counter could not safely reset.');
  // Pause cloud automation before writing the new state, to avoid an old Drive backup racing this update.
  cloudCfg.receiptResetPendingReview=!!(cloudCfg.clientId||cloudCfg.fileId||cloudCfg.lastSyncAt);
  cloudConfigSave();
  suppressCloudSync=true;
  try{await replacePhoneStateSafely(validate);}finally{suppressCloudSync=false;}
  cloudCfg.lastSyncedFingerprint='';cloudConfigSave();
  cloud.conflict=null;$('#modalRoot').innerHTML='';draft=null;
  render();updateCloudBadge();
  toast(cloudCfg.receiptResetPendingReview?'Receipt now starts at #1. Review Drive before syncing.':'Next receipt reset to #1. Safety copy saved.');
 }catch(err){cloudCfg.receiptResetPendingReview=oldReview;cloudConfigSave();console.error('Reset receipt failed:',err);toast('Reset cancelled safely: '+String(err.message||err));}
 finally{resetReceiptBusy=false;}
}

async function v3ReadPlate(input){const file=input.files?.[0];if(!file)return;const url=URL.createObjectURL(file);let img;try{img=await createImageBitmap(file);if('TextDetector' in window){const detector=new TextDetector();const items=await detector.detect(img);const found=items.map(x=>v3norm(x.rawValue)).find(x=>/^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{1,4}$/.test(x));if(found){if(confirm('Plate read: '+found+'. Is this correct?')){draft.carNo=found;render();v3AutoFill();}else toast('Please enter number manually.');}else toast('Could not confidently read the plate. Please type it manually.');}else toast('Camera image captured but this browser does not support text recognition. Enter car number manually.');}catch(err){toast('Plate capture unavailable. Type the number manually.');}finally{URL.revokeObjectURL(url);if(img?.close)img.close();input.value='';}}

function v3ReceiptQR(id){const r=db.records.find(x=>x.id===id)||lastReceipt;if(!r)return toast('Receipt not found.');if(typeof QRCode==='undefined')return toast('QR component not available in this build.');const payload=`RADHIKA WASHING CENTER\nReceipt #${r.receiptNo}\n${r.date} ${r.time}\nVehicle ${r.carNo}\nService ${r.service}\nAmount INR ${r.price}\n${r.method} ${r.status}`;try{const q=new QRCode(-1,1);q.addData(payload);q.make();const n=q.getModuleCount();const canvas=document.createElement('canvas');canvas.width=canvas.height=440;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,440,440);let cell=Math.floor(400/n),pad=Math.floor((440-cell*n)/2);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect(pad+x*cell,pad+y*cell,cell,cell);canvas.toBlob(blob=>{if(!blob)return toast('QR generation failed.');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Radhika_Receipt_QR_'+r.receiptNo+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Receipt QR downloaded. Scan displays receipt details, not a webpage.');},'image/png');}catch(err){toast('QR could not be generated.');}}

async function v3HashPIN(pin){const data=new TextEncoder().encode('radhika-manager-v3-pin:'+pin);const d=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(d),x=>x.toString(16).padStart(2,'0')).join('');}

let deletingEmployee=false;
async function deleteUnusedEmployee(id){

    await savePhoneSafetyCopy('Before deleting unused employee: '+employee.name);
    // Re-check immediately before committing; do not remove if linked since dialog opened.
    if(employeeHasLinkedData(employeeDeletionDependencies(id))){openEmployeeDelete(id);toast('Deletion blocked: linked records were added.');return;}

    if(draft&&Array.isArray(draft.staff))draft.staff=draft.staff.filter(x=>x!==id);

    toast(employee.name+' deleted. Phone Safety Copy saved.');

function handleInput(e){if(e.target.id==='receiptResetKeyword')updateReceiptResetConfirm();const d=e.target.dataset;if(d.draft&&draft){draft[d.draft]=e.target.value;formError='';if(d.draft==='date'){draft.staff=(draft.staff||[]).filter(id=>{const employee=db.employees.find(x=>x.id===id);return isAssignmentAllowed(employee,draft.date)||assignedEarlier(employee,draft.date,draft.id);});render();}}if(e.target.dataset.incentiveWorker)updateIncentiveEditorTotal();if(d.filter){filter[d.filter]=e.target.value;const active=document.activeElement;const sel=active?.selectionStart;render();const i=$(`[data-filter="${d.filter}"]`);if(i){i.focus();if(d.filter==='search'&&typeof sel==='number')i.setSelectionRange(sel,sel);}}}
function handleChange(e){if(e.target.id==='receiptResetCertify')updateReceiptResetConfirm();const d=e.target.dataset;if(d.actionChange==='attendance-date'){attDate=e.target.value;render();}else if(d.actionChange==='attendance-status'){
  const old=attendanceStatus(d.id,attDate),value=e.target.value,affected=db.records.filter(r=>r.date===attDate&&(r.staff||[]).includes(d.id)).length;

  db.attendance[attDate]=db.attendance[attDate]||{};db.attendance[attDate][d.id]=value;persist();render();toast('Attendance updated. New assignments follow the new status.');
}else if(d.actionChange==='incentive-month'){incMonth=e.target.value;render();}
else if(d.actionChange==='payroll-month'){payMonth=e.target.value;render();}
else if(d.actionChange==='work-days'){db.settings.workingDays=Number(e.target.value)||26;persist();toast('Reference updated.');}
else if(d.payfield){const k=payMonth+'|'+d.id;db.payroll[k]=db.payroll[k]||{attendance:false,performance:false,deduction:0};db.payroll[k][d.payfield]=e.target.type==='checkbox'?e.target.checked:Math.max(0,Number(e.target.value)||0);persist();render();}
else if(d.filter&&e.target.tagName==='SELECT'){filter[d.filter]=e.target.value;render();}}
document.addEventListener('click',v3Click);document.addEventListener('click',handleClick);document.addEventListener('input',v3Input);document.addEventListener('input',handleInput);document.addEventListener('change',v3Change);document.addEventListener('change',handleChange);document.addEventListener('submit',v3Submit);document.addEventListener('submit',e=>{if(e.target.id==='employeeForm'){e.preventDefault();saveEmployee(e.target);}else if(e.target.id==='incentiveForm'){e.preventDefault();saveIncentiveAdjustments(e.target);}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';});
